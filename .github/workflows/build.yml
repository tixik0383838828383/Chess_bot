name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Build Fairy-Stockfish for arm64
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_ROOT}"
          export PATH="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          git clone --depth 1 https://github.com/fairy-stockfish/Fairy-Stockfish.git
          cd Fairy-Stockfish/src
          make -j"$(nproc)" build ARCH=armv8 COMP=ndk largeboards=yes all=yes
          llvm-strip stockfish
          mkdir -p "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a"
          cp stockfish "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libfairystockfish.so"
      - name: Get ffish (rules for all variants, runs in the WebView)
        run: |
          npm install ffish --no-save
          ls node_modules/ffish
          cp node_modules/ffish/ffish.js node_modules/ffish/ffish.wasm app/src/main/assets/
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Chess_bot-apk
          path: app/build/outputs/apk/debug/app-debug.apk
